# vavi sur Fly : une machine à Paris (4 Go depuis le 27/11, pour deux builds à la fois, `lib/atelier/la-file.ts`), arrêtée quand personne ne s'en sert.
app = "vavi-essai"
primary_region = "cdg"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/sante"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "4gb"
  cpus = 2

# Un déploiement démarre la nouvelle machine, attend qu'elle réponde à /api/sante, puis seulement arrête l'ancienne : sans
# cela, la seule machine s'arrêtait pendant une à deux minutes et Claude ne joignait plus vavi (Antoine, 27/11 13h25).
[deploy]
  strategy = "bluegreen"
