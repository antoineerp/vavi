# vavi à l'essai sur Fly (avant le lot 9 et OVH) : une machine à Paris, arrêtée quand personne ne s'en sert.
app = "vavi-essai"
primary_region = "cdg"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/sante"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "2gb"
  cpus = 2
