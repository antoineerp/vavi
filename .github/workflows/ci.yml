name: CI

# Un seul passage par changement : la PR, puis main une fois fusionnée (une branche poussée sans PR ne lance rien).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  porte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Tests, dont le build d'une app posée (VAVI_BATIR)
        run: pnpm test
        env:
          VAVI_BATIR: 'oui'
      - name: Tests sur PostgreSQL réel (en root, comme l'exige le banc)
        run: sudo -E env "PATH=$PATH" VAVI_EXIGER_POSTGRES=oui pnpm exec vitest run test/backend test/relais test/projets test/vente test/formulaires test/stripe-connect test/conformite test/capacites test/abonnements test/administration test/export.test.ts
      - name: Fermeture des imports
        run: pnpm fermeture
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
