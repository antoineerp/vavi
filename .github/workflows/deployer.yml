name: Déployer l'essai sur Fly

# Après chaque CI verte sur main (décision d'Antoine du 24/11 au soir), ou à la main (onglet Actions, « Run workflow »).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deployer
  cancel-in-progress: false

jobs:
  deployer:
    # Un push sur main dont la CI est verte ; jamais une CI rouge, jamais une branche de PR.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Le commit que la CI a validé, pas un main plus récent.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Les migrations de la base en attente, avant le déploiement : une qui échoue arrête tout, le site reste sur
      # l'ancienne version (Antoine, 28/11 : « il faut que tout cela se fasse de manière automatique »).
      - name: Appliquer les migrations de la base
        env:
          VAVI_BASE_URL: ${{ secrets.VAVI_BASE_URL }}
        run: |
          # Un commit d'avant l'outil (le déploiement d'un main plus ancien) se déploie comme avant.
          if [ ! -f scripts/appliquer-les-migrations.ts ]; then echo "::warning::pas d'outil de migration dans ce commit"; exit 0; fi
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          npx --yes tsx@4.19.2 scripts/appliquer-les-migrations.ts
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: >
          flyctl deploy --remote-only
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}"
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}"
          --build-arg VAVI_VERSION="${{ github.event.workflow_run.head_sha || github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
